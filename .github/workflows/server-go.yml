name: Go OTA server

on:
  push:
    paths:
      - 'server/**'
      - '.github/workflows/server-go.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-go.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
      - run: go test ./...
